services:
  db:
    image: postgres:17
    container_name: banking-db
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: banking-api
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/banking_db
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: banking-frontend
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  postgres_data: