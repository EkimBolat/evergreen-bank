name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: banking_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production-use
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/banking_db
        run: mvn clean test

      - name: Build application
        env:
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci-pipeline-only-not-for-production-use
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/banking_db
        run: mvn clean package -DskipTests

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build